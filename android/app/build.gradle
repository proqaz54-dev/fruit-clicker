plugins {
    id 'com.android.application' version '8.4.0'
}

android {
    namespace 'com.fruitclicker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.fruitclicker.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
}