name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate JavaScript
        run: |
          echo "Checking JavaScript syntax..."
          for file in js/*.js; do
            echo "Checking $file..."
            node --check "$file" && echo "✓ $file is valid"
          done

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cache: false
          accept-android-sdk-license: true

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          ls -la ${ANDROID_HOME:-/usr/local/lib/android/sdk} || true
          ls -la ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin || true
          ls -la ${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms || true
          ls -la ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools || true
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          cat android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          ls -la
          ls -la app/src/main/java || true
          ls -la app/src/main/java/com/fruitclicker/app || true
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-clicker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Check for production-ready files
        run: |
          echo "Checking for required files..."
          test -f index.html && echo "✓ index.html exists"
          test -f styles.css && echo "✓ styles.css exists"
          test -f js/game.js && echo "✓ js/game.js exists"

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-clicker-build
          path: |
            index.html
            styles.css
            js/
            android/
          retention-days: 7
