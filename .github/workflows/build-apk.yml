name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cache: true
          accept-android-sdk-license: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        shell: bash
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Validate web assets
        run: |
          echo "Checking web assets..."
          test -f index.html && echo "✓ index.html exists"
          test -f styles.css && echo "✓ styles.css exists"
          test -f js/game.js && echo "✓ js/game.js exists"

      - name: Prepare web assets for Android
        run: |
          echo "Copying web assets into Android project..."
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp styles.css android/app/src/main/assets/
          cp -r js android/app/src/main/assets/
          ls -la android/app/src/main/assets/
          ls -la android/app/src/main/assets/js/

      - name: Build Debug APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-clicker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease --no-daemon --stacktrace
          else
            gradle clean assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fruit-clicker-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
        continue-on-error: true
