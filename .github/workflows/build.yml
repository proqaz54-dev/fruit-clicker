name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate JavaScript
        run: |
          echo "Checking JavaScript syntax..."
          for file in js/*.js; do
            echo "Checking $file..."
            node --check "$file" && echo "✓ $file is valid"
          done

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd $ANDROID_HOME/cmdline-tools/latest
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools/* .
          rm -rf cmdline-tools cmdtools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/
          ls -la $ANDROID_HOME/cmdline-tools/latest/bin/ || true
          ls -la $ANDROID_HOME/platforms/ || true
          ls -la $ANDROID_HOME/build-tools/ || true
          cat android/local.properties

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper not found, downloading..."
            cd android
            curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
            unzip -q gradle.zip
            mv gradle-8.4 gradle
            chmod +x gradle/bin/gradle
            cd ..
          fi

      - name: Build Debug APK
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            ./gradle/bin/gradle assembleDebug --stacktrace --info
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-clicker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Check for production-ready files
        run: |
          echo "Checking for required files..."
          test -f index.html && echo "✓ index.html exists"
          test -f styles.css && echo "✓ styles.css exists"
          test -f js/game.js && echo "✓ js/game.js exists"

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-clicker-build
          path: |
            index.html
            styles.css
            js/
            android/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run linter
        run: |
          if [ -f "package.json" ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No lint script found"
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate game functionality
        run: |
          echo "Testing game files..."
          node -e "
            const fs = require('fs');
            const gameCode = fs.readFileSync('js/game.js', 'utf8');

            const checks = [
              ['FRUITS array', /const FRUITS = \[/],
              ['CRYSTAL_CASES', /const CRYSTAL_CASES/],
              ['TIME_REWARDS', /const TIME_REWARDS/],
              ['DAILY_REWARDS', /const DAILY_REWARDS/],
              ['Game class', /class Game/],
              ['clickFruit method', /clickFruit\(e\)/],
              ['crystals property', /this\.crystals/],
              ['renderCases method', /renderCases\(\)/],
              ['renderTimeRewards method', /renderTimeRewards\(\)/],
              ['renderDailyRewards method', /renderDailyRewards\(\)/]
            ];

            let allPassed = true;
            checks.forEach(([name, regex]) => {
              if (regex.test(gameCode)) {
                console.log('✓', name);
              } else {
                console.log('✗', name);
                allPassed = false;
              }
            });

            if (allPassed) {
              console.log('\n✓ All game functionality checks passed!');
            } else {
              console.log('\n✗ Some checks failed!');
              process.exit(1);
            }
          "

  deploy-preview:
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview
        run: |
          echo "Preview deployment ready for PR #${PR_NUMBER}"
          echo "Artifacts available for download"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
